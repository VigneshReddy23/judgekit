[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "judgekit"
version = "0.1.0"
description = "An LLM evaluation harness: deterministic checks, calibrated LLM-as-judge scorers, and a CI gate."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "boto3>=1.34",
    "anthropic>=1.9",
    "jinja2>=3.1",
    "scikit-learn>=1.4",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
]

[project.scripts]
judgekit = "judgekit.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/judgekit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# boto3/botocore/sklearn ship without type hints; treat them as untyped rather than fail.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
