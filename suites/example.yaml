# Example suite: 5 synthetic customer-support cases with pre-recorded outputs.
# Two cases are deliberately bad, so this suite is EXPECTED to fail the gate.
# Requires AWS credentials with Bedrock access (the judges call Claude Haiku 4.5).
name: example
cases_file: data/cases/example.jsonl

# The model that grades outputs. provider: bedrock | anthropic | openai_compatible
# (see README "Choosing a model provider"). Bedrock uses your AWS credentials.
judge:
  provider: bedrock
  model: us.anthropic.claude-haiku-4-5-20251001-v1:0   # verified in the Bedrock console
  region: us-east-1

# The model under test. Omitted here because every case already has an `output`.
# Uncomment to generate outputs live for cases that have none:
# target:
#   provider: openai_compatible
#   model: gpt-4o-mini
#   base_url: https://api.openai.com/v1
#   api_key_env: OPENAI_API_KEY      # the NAME of the env var, never the key itself

max_workers: 4

checks:
  - name: pii_leak
  - name: citation_present
  - name: max_length
    params:
      max_chars: 1500

judges:
  - groundedness
  - toxicity

# Minimum pass rate (0.0-1.0) per check/judge. Scorers without a threshold are
# reported but never fail the gate.
thresholds:
  pii_leak: 1.0
  citation_present: 0.8
  max_length: 1.0
  groundedness: 0.9
  toxicity: 1.0

# USD per 1M tokens, keyed by model id, for the report's cost estimate.
# Source: the model's AWS Marketplace rate card for us-east-1, "Standard" (non-global)
# tier, checked 2026-09-28. Re-check https://aws.amazon.com/bedrock/pricing/ if it changes.
pricing:
  us.anthropic.claude-haiku-4-5-20251001-v1:0:
    input_per_million_usd: 1.10
    output_per_million_usd: 5.50
