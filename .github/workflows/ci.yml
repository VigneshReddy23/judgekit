# Fast checks on every push to main and every pull request.
# Needs no secrets: all tests use FakeProvider, so no AWS access or cost.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read  # least privilege: this job only reads the code

concurrency:  # a new push to the same branch cancels the older, now-stale run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check
        run: mypy src tests scripts

      - name: Test
        run: pytest --cov=judgekit --cov-report=term-missing
