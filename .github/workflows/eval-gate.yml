# Runs a real eval suite and fails if any scorer is below its threshold.
# Triggered manually, or by PRs that change rubrics or suites.
# Works with any provider in the suite's judge/target config:
#   bedrock            -> AWS via OIDC (secret AWS_ROLE_ARN; no AWS keys stored). docs/aws-oidc-setup.md
#   anthropic          -> secret ANTHROPIC_API_KEY
#   openai_compatible  -> secret OPENAI_API_KEY (or whatever the suite's api_key_env names)
name: Eval gate

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite file to run
        default: suites/example.yaml
  pull_request:
    paths:
      - "src/judgekit/prompts/**"
      - "suites/**"

permissions:
  id-token: write  # lets the job request a GitHub OIDC token for AWS
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    # PRs from forks get no OIDC token or secrets, so skip them instead of failing.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUITE: ${{ inputs.suite || 'suites/example.yaml' }}
      # Secrets that aren't set are empty strings, so unused providers cost nothing.
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ROLE_ARN != ''  # only for suites that use provider: bedrock
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: judgekit-eval-${{ github.run_id }}

      - name: Run eval suite
        run: judgekit run "$SUITE" --report report.html

      - name: Upload HTML report
        if: always()  # upload even when the gate fails; that is when you need it most
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: report.html
          if-no-files-found: warn
